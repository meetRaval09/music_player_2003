<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PIXEL TUNES 2003</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="node_modules/@fontsource/press-start-2p/index.css">
<style>
:root{
  --bg:#0b0b1e; --chassis:#8b8fa8; --chassis-hi:#c9ccdc; --chassis-lo:#4a4d63;
  --lcd:#0c1a0c; --lcd-on:#5dff6a; --lcd-dim:#1f5a26; --accent:#ff7a1a; --pink:#ff3d8b; --ink:#111;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%;background:transparent}
body{
  background:transparent; overflow:hidden;
  font-family:'Press Start 2P',monospace,Courier;
  color:var(--lcd-on); display:flex; justify-content:center; align-items:flex-start; padding:10px;
  image-rendering:pixelated; user-select:none;
}
.player{
  width:340px; background:var(--chassis); padding:8px;
  border:4px solid; border-color:var(--chassis-hi) var(--chassis-lo) var(--chassis-lo) var(--chassis-hi);
  box-shadow:0 0 0 3px #000;
}
.titlebar{
  background:linear-gradient(90deg,var(--tb1,#2a1b6e),var(--tb2,#b0308c) 60%,var(--accent));
  color:#fff; font-size:8px; padding:6px; display:flex; justify-content:space-between; align-items:center;
  border:2px solid #000; margin-bottom:8px; letter-spacing:1px;
}
.titlebar{-webkit-app-region:drag;cursor:move}
.wb{-webkit-app-region:no-drag;display:flex;gap:4px}
.wb button{font-size:7px;padding:3px 5px;outline:1px solid #000;border-width:2px;color:var(--ink)}
.wb button.on{color:var(--pink)}
.player.compact .opts,.player.compact .opts2,.player.compact .plhead,.player.compact #list,.player.compact .foot,.player.compact .credit{display:none}
.lcd{
  background:var(--lcd); border:4px solid; border-color:var(--chassis-lo) var(--chassis-hi) var(--chassis-hi) var(--chassis-lo);
  padding:8px; position:relative;
}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(#0000 0 2px,#00000030 2px 3px)}
.row{display:flex;justify-content:space-between;align-items:center}
#time{font-size:20px;text-shadow:0 0 6px var(--lcd-on)}
.tiny{font-size:7px;color:var(--lcd-dim)}
.tiny.on{color:var(--lcd-on)}
#marquee{font-size:9px;margin:8px 0 6px;height:12px;white-space:pre;overflow:hidden;color:var(--lcd-on)}
canvas#stage{width:100%;aspect-ratio:2/1;display:block;background:#000;border:2px solid var(--lcd-dim);image-rendering:pixelated;margin-bottom:8px}
canvas#vis{width:100%;height:48px;display:block;background:#000;border:2px solid var(--lcd-dim);image-rendering:pixelated}
.bar{height:14px;background:#000;border:2px solid var(--lcd-dim);margin-top:8px;position:relative;cursor:pointer}
.bar .fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--lcd-on) 0 6px,#0000 6px 8px)}
.bar.vol{height:10px}
.bar.vol .fill{background:repeating-linear-gradient(90deg,var(--accent) 0 6px,#0000 6px 8px)}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 6px}
button{
  font-family:inherit;font-size:10px;padding:10px 0;cursor:pointer;color:var(--ink);background:var(--chassis);
  border:3px solid; border-color:var(--chassis-hi) var(--chassis-lo) var(--chassis-lo) var(--chassis-hi);
  outline:2px solid #000;
}
button:active,button.on{border-color:var(--chassis-lo) var(--chassis-hi) var(--chassis-hi) var(--chassis-lo);background:#7a7e96;transform:translate(1px,1px)}
button.on{color:var(--pink)}
button.big{background:var(--accent);color:#000}
.opts{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.opts button{font-size:7px;padding:8px 0}
.opts2{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:8px}
.opts2 button{font-size:5px;padding:8px 0;min-width:0;overflow:hidden;letter-spacing:0}
.volrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:7px;color:var(--ink)}
.volrow .bar{flex:1;margin-top:0}
.plhead{background:#000;color:var(--pink);font-size:8px;padding:6px;display:flex;justify-content:space-between;border:2px solid #000}
#list{height:170px;overflow-y:auto;background:var(--lcd);border:4px solid;border-color:var(--chassis-lo) var(--chassis-hi) var(--chassis-hi) var(--chassis-lo)}
#list::-webkit-scrollbar{width:12px}
#list::-webkit-scrollbar-track{background:#000}
#list::-webkit-scrollbar-thumb{background:var(--chassis);border:2px solid #000}
.item{font-size:8px;padding:7px 6px;display:flex;gap:6px;cursor:pointer;color:var(--lcd-on);border-bottom:1px dashed var(--lcd-dim)}
.item .n{color:var(--lcd-dim);min-width:22px}
.item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .x{color:var(--pink);visibility:hidden}
.item:hover{background:#133313}.item:hover .x{visibility:visible}
.item.cur{background:var(--lcd-on);color:var(--lcd)}.item.cur .n{color:var(--lcd)}
.sphelp{font-size:7px;line-height:13px;padding:10px;color:var(--lcd-on)}
.sphelp b{color:var(--pink);font-weight:normal}
.sphelp input{width:100%;font-family:inherit;font-size:7px;padding:6px;margin:6px 0;background:#000;color:var(--lcd-on);border:2px solid var(--lcd-dim);outline:none}
.sphelp button{width:100%;font-size:8px;padding:8px 0;margin-top:4px}
.item.act{color:var(--pink)}
.sphead{font-size:7px;color:var(--pink);padding:6px 6px 3px;border-top:1px dashed var(--lcd-dim)}
.spsug{margin:0 -8px}
.spsug .item{border-top:1px dashed var(--lcd-dim)}
.empty{font-size:8px;line-height:16px;padding:14px;color:var(--lcd-dim);text-align:center}
.foot{display:flex;gap:6px;margin-top:8px}
.foot button{flex:1;font-size:7px;padding:9px 0}
.drop{outline:3px dashed var(--pink);outline-offset:-6px}
.credit{font-size:6px;text-align:center;margin-top:8px;color:var(--ink)}
</style>
</head>
<body>
<div class="player" id="app">
  <div class="titlebar"><span>PIXEL TUNES 2003</span><span class="wb"><button id="wpin" title="Keep on top">PIN</button><button id="wlist" title="Mini / full">MINI</button><button id="wmin" title="Hide">_</button><button id="wx" title="Close">X</button></span></div>

  <div class="lcd">
    <div class="row">
      <div id="time">00:00</div>
      <div style="text-align:right">
        <div class="tiny" id="st">STOP</div>
        <div class="tiny" id="kbps">128KBPS</div>
      </div>
    </div>
    <div id="marquee">*** WELCOME ***</div>
    <canvas id="stage" width="96" height="48"></canvas>
    <canvas id="vis" width="96" height="16"></canvas>
    <div class="bar" id="seek"><div class="fill" id="seekfill"></div></div>
  </div>

  <div class="controls">
    <button id="prev" title="Previous">|&lt;</button>
    <button id="play" class="big" title="Play / Pause">&gt;</button>
    <button id="stop" title="Stop">■</button>
    <button id="next" title="Next">&gt;|</button>
    <button id="mute" title="Mute">VOL</button>
  </div>

  <div class="opts">
    <button id="shuf">SHUFFLE</button>
    <button id="rep">REPEAT</button>
    <button id="clr">CLEAR</button>
    <button id="spot" title="Show and control the Spotify desktop app">SPOTIFY</button>
  </div>
  <div class="opts2">
    <button id="bpet" title="Your pixel pet">PET</button>
    <button id="blyr" title="Lyrics">LYRICS</button>
    <button id="bskin" title="Change the look">SKIN</button>
    <button id="bclip" title="Save a short video of the pixel animation">CLIP</button>
    <button id="bamb" title="Full screen pixel scene">AMBIENT</button>
    <button id="b8" title="Hear the song as an old game console would play it">8-BIT</button>
  </div>

  <div class="volrow"><span>VOL</span><div class="bar vol" id="volbar"><div class="fill" id="volfill"></div></div></div>

  <div class="plhead"><span id="plt">PLAYLIST</span><span id="count">0 SONGS</span></div>
  <div id="list"></div>

  <div class="foot">
    <button id="addf">+ FILES</button>
    <button id="addd">+ FOLDER</button>
  </div>
  <input type="file" id="fin" accept="audio/*,.lrc" multiple hidden>
  <input type="file" id="din" webkitdirectory multiple hidden>
  <div class="credit">DRAG &amp; DROP SONGS HERE</div>
</div>

<audio id="au" preload="auto"></audio>

<script src="pixelart.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const au=$('au');
let songs=[];          // {id,name,blob}
let cur=-1, shuffle=false, repeat=false, url=null, ctx, analyser, data, origGain;
let marqText='', marqPos=0;
let spot=false, sp=null, spAt=0, spKey='';
let spView='lists', spPl=null, spQ='', spRes=[], spMore=false;
if(window.PixelArt){PixelArt.init($('stage'));PixelArt.levelFn=()=>{if(!analyser)return 0;analyser.getByteFrequencyData(data);return Math.min(1,(data[0]+data[1]+data[2]+data[3])/4/200)}}

/* ---------- storage (IndexedDB keeps songs between sessions) ---------- */
let db;
const open=indexedDB.open('pixeltunes',1);
open.onupgradeneeded=()=>open.result.createObjectStore('songs',{keyPath:'id',autoIncrement:true});
open.onsuccess=()=>{db=open.result;load()};
open.onerror=()=>{setMarq('NO STORAGE - SESSION ONLY')};
function tx(mode){return db.transaction('songs',mode).objectStore('songs')}
function load(){
  const r=tx('readonly').getAll();
  r.onsuccess=()=>{songs=r.result;render();setMarq(songs.length?'PRESS PLAY TO START':'ADD SONGS TO BEGIN')};
}
function save(file){
  const rec={name:clean(file.name),blob:file};
  return new Promise(res=>{
    if(!db){songs.push(rec);return res()}
    const r=tx('readwrite').add(rec);
    r.onsuccess=()=>{rec.id=r.result;songs.push(rec);res()};
    r.onerror=()=>res();
  });
}
function clean(n){return n.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').toUpperCase()}

async function addFiles(list){
  let consumed=0; if(window.PTX&&PTX.takeFiles){const r=PTX.takeFiles(list);list=r.rest;consumed=r.n}
  const files=[...list].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|ogg|m4a|flac|aac|opus)$/i.test(f.name));
  if(!files.length){if(!consumed)setMarq('NO AUDIO FILES FOUND');return}
  files.sort((a,b)=>a.name.localeCompare(b.name));
  for(const f of files) await save(f);
  render();
  if(cur<0&&songs.length) setMarq(songs.length+' SONGS READY - PRESS PLAY');
}

/* ---------- playlist UI ---------- */
function render(){
  pushBuddy(true);
  if(window.PTX&&PTX.active()){PTX.paint();return}
  if(spot){spList();return}
  const L=$('list'); L.innerHTML='';
  $('count').textContent=songs.length+' SONGS';
  if(!songs.length){L.innerHTML='<div class="empty">PLAYLIST EMPTY<br><br>CLICK + FILES OR + FOLDER<br>OR DROP MP3s HERE</div>';return}
  songs.forEach((s,i)=>{
    const d=document.createElement('div');d.className='item'+(i===cur?' cur':'');
    d.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="t"></span><span class="x">X</span>';
    d.querySelector('.t').textContent=s.name;
    d.onclick=e=>{ if(e.target.className==='x'){remove(i)} else {playIndex(i)} };
    L.appendChild(d);
  });
}
function remove(i){
  const s=songs[i];
  if(db&&s.id!=null) tx('readwrite').delete(s.id);
  songs.splice(i,1);
  if(i===cur){au.pause();cur=-1;setState('STOP');setMarq('*** REMOVED ***')}
  else if(i<cur)cur--;
  render();
}

/* ---------- playback ---------- */
function setupAudioGraph(){
  if(ctx)return;
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaElementSource(au);
    analyser=ctx.createAnalyser();analyser.fftSize=64;
    data=new Uint8Array(analyser.frequencyBinCount);
    origGain=ctx.createGain();
    src.connect(analyser);analyser.connect(origGain);origGain.connect(ctx.destination);
  }catch(e){}
}
function playIndex(i){
  if(i<0||i>=songs.length)return;
  if(spot)$('spot').click();
  setupAudioGraph(); if(ctx&&ctx.state==='suspended')ctx.resume();
  cur=i;
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(songs[i].blob);
  au.src=url; au.play();
  if(window.PixelArt)PixelArt.setSong({title:songs[i].name,cover:songs[i].blob});
  setMarq('*** '+songs[i].name+' ***');
  render();
  const el=$('list').children[i]; if(el)el.scrollIntoView({block:'nearest'});
}
function next(auto){
  if(spot){if(window.api)api.spotifyCmd('next');return}
  if(!songs.length)return;
  if(shuffle&&songs.length>1){let n;do{n=Math.floor(Math.random()*songs.length)}while(n===cur);return playIndex(n)}
  let n=cur+1;
  if(n>=songs.length){ if(repeat||!auto)n=0; else {setState('STOP');return} }
  playIndex(n);
}
function prev(){
  if(spot){if(window.api)api.spotifyCmd('prev');return}
  if(!songs.length)return;
  if(au.currentTime>3){au.currentTime=0;return}
  playIndex(cur<=0?songs.length-1:cur-1);
}
$('play').onclick=()=>{
  if(spot){if(window.api)api.spotifyCmd('toggle');return}
  if(!songs.length){setMarq('ADD SONGS FIRST!');return}
  if(cur<0)return playIndex(0);
  if(au.paused){setupAudioGraph();ctx&&ctx.resume();au.play()}else au.pause();
};
$('stop').onclick=()=>{if(spot){if(window.api)api.spotifyCmd('pause');return}au.pause();au.currentTime=0;setState('STOP')};
$('next').onclick=()=>next(false);
$('prev').onclick=prev;
$('shuf').onclick=e=>{shuffle=!shuffle;e.target.classList.toggle('on',shuffle)};
$('rep').onclick=e=>{repeat=!repeat;e.target.classList.toggle('on',repeat)};
$('clr').onclick=()=>{
  if(!songs.length)return;
  if(!confirm('REMOVE ALL SONGS FROM PLAYER?'))return;
  au.pause();cur=-1;songs=[];if(db)tx('readwrite').clear();render();setState('STOP');setMarq('PLAYLIST CLEARED');
};
au.onplay=()=>setState('PLAY');
au.onpause=()=>{ if(au.currentTime>0&&!au.ended)setState('PAUSE') };
au.onended=()=>next(true);
au.onerror=()=>{setMarq('CANNOT PLAY THIS FILE');setTimeout(()=>next(true),1200)};
au.onloadedmetadata=()=>pushBuddy(true);
function setState(s){if(window.PixelArt)PixelArt.setPlaying(s==='PLAY');pushBuddy(true);if(window.api&&window.api.playing)window.api.playing(s==='PLAY');$('st').textContent=s;$('st').classList.toggle('on',s==='PLAY');$('play').textContent=s==='PLAY'?'II':'>'}

/* ---------- time, seek, volume ---------- */
const fmt=t=>{t=Math.floor(t||0);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
au.ontimeupdate=()=>{
  pushBuddy();
  $('time').textContent=fmt(au.currentTime);
  $('seekfill').style.width=(au.duration?au.currentTime/au.duration*100:0)+'%';
};
$('seek').onclick=e=>{
  if(!au.duration)return;const r=e.currentTarget.getBoundingClientRect();
  au.currentTime=(e.clientX-r.left)/r.width*au.duration;
};
function setVol(v){v=Math.max(0,Math.min(1,v));au.volume=v;$('volfill').style.width=v*100+'%';try{localStorage.vol=v}catch(e){}}
$('volbar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();au.muted=false;setVol((e.clientX-r.left)/r.width)};
$('mute').onclick=e=>{au.muted=!au.muted;e.target.classList.toggle('on',au.muted)};
let v=0.8;try{if(localStorage.vol)v=parseFloat(localStorage.vol)}catch(e){}
setVol(v);

/* ---------- marquee (stepped text scroll) ---------- */
function setMarq(t){marqText=t+'     ';marqPos=0}
setInterval(()=>{
  const w=28;
  if(marqText.length<=w){$('marquee').textContent=marqText;return}
  const s=marqText+marqText;
  $('marquee').textContent=s.substr(marqPos,w);
  marqPos=(marqPos+1)%marqText.length;
},220);
setMarq('*** WELCOME TO PIXEL TUNES ***');

/* ---------- pixel visualizer ---------- */
const cv=$('vis'),c2=cv.getContext('2d');
function draw(){
  requestAnimationFrame(draw);
  c2.fillStyle='#000';c2.fillRect(0,0,96,16);
  const bars=16,bw=6;
  for(let i=0;i<bars;i++){
    let h;
    if(analyser&&!au.paused){analyser.getByteFrequencyData(data);h=Math.round(data[i+1]/255*16)}
    else h=0;
    for(let y=0;y<h;y++){
      c2.fillStyle=y>11?'#ff3d8b':y>7?'#ff7a1a':'#5dff6a';
      c2.fillRect(i*bw,15-y,bw-1,1);
    }
  }
}
draw();

/* ---------- add songs ---------- */
$('addf').onclick=()=>$('fin').click();
$('addd').onclick=()=>$('din').click();
$('fin').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('din').onchange=e=>{addFiles(e.target.files);e.target.value=''};
const app=$('app');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();app.classList.add('drop')}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();app.classList.remove('drop')}));
document.addEventListener('drop',e=>addFiles(e.dataTransfer.files));

/* ---------- Desk Buddy link: tell the ESP32 gadget what is playing, obey its commands ---------- */
let lastPush=0,lastKey='';
function pushBuddy(force){
  if(!(window.api&&window.api.buddyState))return;
  if(spot){
    const ok=sp&&sp.ok;
    const title=ok?(sp.artist?sp.title+' - '+sp.artist:sp.title):'';
    const playing=!!(ok&&sp.playing);
    const key='S'+title+'|'+playing, now=Date.now();
    if(!force&&key===lastKey&&now-lastPush<1000)return;
    lastKey=key;lastPush=now;
    window.api.buddyState({title,playing,pos:spPos(),dur:ok?sp.dur:0,index:ok?1:0,count:ok?1:0});
    return;
  }
  const title=(cur>=0&&songs[cur])?songs[cur].name:'';
  const playing=cur>=0&&!au.paused&&!au.ended;
  const key=title+'|'+playing;
  const now=Date.now();
  if(!force&&key===lastKey&&now-lastPush<1000)return;
  lastKey=key;lastPush=now;
  window.api.buddyState({title,playing,pos:Math.floor(au.currentTime||0),dur:isFinite(au.duration)?Math.floor(au.duration):0,index:cur+1,count:songs.length});
}
if(window.api&&window.api.onBuddyCmd){
  window.api.onBuddyCmd(name=>{
    if(name==='toggle')$('play').click();
    else if(name==='play'){if(au.paused)$('play').click()}
    else if(name==='pause'){if(!au.paused)$('play').click()}
    else if(name==='next')$('next').click();
    else if(name==='prev')$('prev').click();
    else if(name==='volup'){au.muted=false;setVol(au.volume+0.1)}
    else if(name==='voldown')setVol(au.volume-0.1);
    pushBuddy(true);
  });
}

/* ---------- Spotify mode: show and control the Spotify desktop app (Windows) ---------- */
/* ---- Spotify playlists browser (uses your Spotify login) ---- */
function mk(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function spMsg(L,lines){L.innerHTML='';const d=mk('div','empty');d.innerHTML=lines.map(x=>x.replace(/[&<>]/g,'')).join('<br><br>');L.appendChild(d)}
async function spList(){
  const L=$('list');
  if(!spot)return;
  const st=await api.spStatus();
  if(!spot)return;
  if(!st.hasClient)return spSetup(L,st);
  if(!st.loggedIn)return spConnect(L);
  if(spView==='album'&&spAlb)return spAlbumView(L);
  if(spView==='search')return spSearchView(L);
  if(spView==='tracks'&&spPl)return spTracks(L);
  return spLists(L);
}
function spSetup(L,st){
  $('plt').textContent='SPOTIFY SETUP';$('count').textContent='STEP 1';
  L.innerHTML='';const d=mk('div','sphelp');
  d.appendChild(mk('div',null,'1. OPEN developer.spotify.com/dashboard AND LOG IN. CLICK CREATE APP (ANY NAME).'));
  const r=mk('div',null,'2. REDIRECT URI, PASTE EXACTLY:');d.appendChild(r);
  const u=mk('input');u.readOnly=true;u.value=st.redirect;u.onclick=()=>u.select();d.appendChild(u);
  d.appendChild(mk('div',null,'3. TICK "Web API", SAVE. THEN OPEN SETTINGS AND COPY THE CLIENT ID:'));
  const i=mk('input');i.placeholder='PASTE CLIENT ID HERE';i.id='spcid';d.appendChild(i);
  const b=mk('button',null,'SAVE CLIENT ID');
  b.onclick=async()=>{const r=await api.spSetClient(i.value);if(!r.ok){setMarq('*** '+r.error+' ***');return}spList()};
  d.appendChild(b);L.appendChild(d);
}
function spConnect(L){
  $('plt').textContent='SPOTIFY';$('count').textContent='NOT LOGGED IN';
  L.innerHTML='';const d=mk('div','sphelp');
  d.appendChild(mk('div',null,'CLICK CONNECT. YOUR BROWSER OPENS SPOTIFY. PRESS AGREE, THEN COME BACK HERE.'));
  const b=mk('button',null,'CONNECT SPOTIFY');
  b.onclick=async()=>{b.textContent='WAITING FOR BROWSER...';b.disabled=true;const r=await api.spLogin();if(!r.ok){setMarq('*** '+r.error+' ***');}spList()};
  d.appendChild(b);
  const c=mk('button',null,'CHANGE CLIENT ID');c.onclick=async()=>{await api.spReset();spList()};d.appendChild(c);
  L.appendChild(d);
}
async function spLists(L){
  $('plt').textContent='SPOTIFY PLAYLISTS';
  L.innerHTML='';L.appendChild(mk('div','empty','LOADING...'));
  const r=await api.spPlaylists();
  if(!spot||spView!=='lists')return;
  if(!r.ok){
    if(r.status===401||/NOT LOGGED/.test(r.error)){await api.spLogout();return spList()}
    return spMsg(L,['COULD NOT LOAD PLAYLISTS',r.error]);
  }
  spPl=null;$('count').textContent=r.data.length+' LISTS';
  L.innerHTML='';spBar(L);
  if(!r.data.length){L.appendChild(mk('div','empty','NO PLAYLISTS FOUND'))}
  r.data.forEach((p,i)=>{
    const it=mk('div','item');it.appendChild(mk('span','n',String(i+1).padStart(2,'0')));
    it.appendChild(mk('span','t',p.name+(p.total!=null?'  ('+p.total+')':'')));
    it.onclick=()=>{spPl=p;spView='tracks';spList()};
    L.appendChild(it);
  });
  const o=mk('div','item');o.appendChild(mk('span','n','--'));o.appendChild(mk('span','t','[ LOG OUT OF SPOTIFY ]'));
  o.onclick=async()=>{await api.spLogout();spView='lists';spList()};L.appendChild(o);
}
let spTimer=null, spSugSeq=0, spAlb=null, spAlbTracks=null, spFrom='lists'; const spCache={};
function spPlayRow(ctx,uri,uris){
  setMarq('*** ASKING SPOTIFY... ***');
  api.spPlay(ctx,uri,uris).then(pr=>{if(!pr.ok)setMarq('*** '+pr.error+' ***')});
}
function spOpenAlbum(al,from){spAlb=al;spAlbTracks=null;spFrom=from;spView='album';spList()}
function spAlbumRow(al,from){
  const it=mk('div','item');it.appendChild(mk('span','n','CD'));
  it.appendChild(mk('span','t',al.name+(al.artist?' - '+al.artist:'')+(al.year?' ('+al.year+')':'')));
  it.onclick=()=>spOpenAlbum(al,from);return it;
}
function spLabel(text){const d=mk('div','sphead',text);return d}
function spBar(L){
  const w=mk('div','sphelp');w.style.padding='6px 8px 0';
  const i=mk('input');i.id='spq';i.placeholder='SEARCH FILM, ALBUM OR SONG';i.value=spQ;
  const sug=mk('div','spsug');
  i.onkeydown=e=>{if(e.key==='Enter'){clearTimeout(spTimer);spSugSeq++;spDoSearch(i.value,false)}};
  i.oninput=()=>{                                   // live suggestions while you type
    clearTimeout(spTimer);
    const q=i.value.trim();
    if(q.length<2){spSugSeq++;sug.innerHTML='';return}
    spTimer=setTimeout(async()=>{
      const seq=++spSugSeq;
      let data=spCache[q.toLowerCase()];
      if(!data){
        const r=await api.spSearch(q,0);
        if(!r.ok)return;
        data={albums:r.data.albums.slice(0,4),items:r.data.items.slice(0,3)};spCache[q.toLowerCase()]=data;
      }
      if(seq!==spSugSeq||!spot||i.value.trim()!==q)return;      // you kept typing: ignore old answer
      sug.innerHTML='';
      if(data.albums.length){sug.appendChild(spLabel('ALBUMS'));data.albums.forEach(al=>sug.appendChild(spAlbumRow(al,'lists')))}
      if(data.items.length){
        sug.appendChild(spLabel('SONGS'));
        const uris=data.items.map(t=>t.uri);
        data.items.forEach(t=>{
          const it=mk('div','item');it.appendChild(mk('span','n','>'));
          it.appendChild(mk('span','t',t.artist?t.name+' - '+t.artist:t.name));
          it.onclick=()=>spPlayRow(null,t.uri,uris);
          sug.appendChild(it);
        });
      }
      if(!data.albums.length&&!data.items.length)sug.appendChild(mk('div','empty','NO MATCHES'));
    },450);
  };
  w.appendChild(i);w.appendChild(sug);L.appendChild(w);
}
let spResAlb=[];
async function spDoSearch(q,more){
  q=(q||'').trim();if(!q)return;
  const L=$('list');
  if(!more){spQ=q;spRes=[];spResAlb=[];spMore=false}
  spView='search';
  $('plt').textContent='SEARCH: '+q.toUpperCase().slice(0,14);
  if(!more){L.innerHTML='';L.appendChild(mk('div','empty','SEARCHING...'))}
  const r=await api.spSearch(q,spRes.length);
  if(!spot||spView!=='search')return;
  if(!r.ok){setMarq('*** '+r.error+' ***');if(!spRes.length&&!spResAlb.length){spView='lists'}return spList()}
  spRes=spRes.concat(r.data.items);spResAlb=spResAlb.concat(r.data.albums);spMore=r.data.more;
  spList();
}
function spSearchView(L){
  $('plt').textContent='SEARCH: '+spQ.toUpperCase().slice(0,14);
  $('count').textContent=spResAlb.length+' ALBUMS';
  L.innerHTML='';spBar(L);
  const back=mk('div','item act');back.appendChild(mk('span','n','<'));back.appendChild(mk('span','t','BACK TO PLAYLISTS'));
  back.onclick=()=>{spView='lists';spList()};L.appendChild(back);
  if(!spRes.length&&!spResAlb.length){L.appendChild(mk('div','empty','NOTHING FOUND. TRY ANOTHER NAME.'));return}
  if(spResAlb.length){L.appendChild(spLabel('ALBUMS'));spResAlb.forEach(al=>L.appendChild(spAlbumRow(al,'search')))}
  if(spRes.length){
    L.appendChild(spLabel('SONGS'));
    const uris=spRes.map(t=>t.uri);
    spRes.forEach((t,i)=>{
      const it=mk('div','item');it.appendChild(mk('span','n','>'));
      it.appendChild(mk('span','t',t.artist?t.name+' - '+t.artist:t.name));
      it.onclick=()=>spPlayRow(null,t.uri,uris);
      L.appendChild(it);
    });
  }
  if(spMore){
    const m=mk('div','item act');m.appendChild(mk('span','n','+'));m.appendChild(mk('span','t','MORE RESULTS'));
    m.onclick=()=>spDoSearch(spQ,true);L.appendChild(m);
  }
}
async function spAlbumView(L){
  const al=spAlb;
  $('plt').textContent=al.name.toUpperCase().slice(0,22);
  L.innerHTML='';L.appendChild(mk('div','empty','LOADING SONGS...'));
  if(!spAlbTracks){
    const r=await api.spAlbum(al.id);
    if(!spot||spView!=='album'||spAlb!==al)return;
    if(!r.ok){L.innerHTML='';const bk=mk('div','item act');bk.appendChild(mk('span','n','<'));bk.appendChild(mk('span','t','BACK'));bk.onclick=()=>{spView=spFrom;spList()};L.appendChild(bk);L.appendChild(mk('div','empty',r.error));return}
    spAlbTracks=r.data;
  }
  L.innerHTML='';
  const back=mk('div','item act');back.appendChild(mk('span','n','<'));back.appendChild(mk('span','t',spFrom==='search'?'BACK TO SEARCH':'BACK TO PLAYLISTS'));
  back.onclick=()=>{spView=spFrom;spList()};L.appendChild(back);
  $('count').textContent=spAlbTracks.length+' SONGS';
  const all=mk('div','item act');all.appendChild(mk('span','n','>'));all.appendChild(mk('span','t','PLAY WHOLE ALBUM'));
  all.onclick=()=>spPlayRow(al.uri,null,null);L.appendChild(all);
  spAlbTracks.forEach((t,i)=>{
    const it=mk('div','item');it.appendChild(mk('span','n',String(i+1).padStart(2,'0')));
    it.appendChild(mk('span','t',t.artist?t.name+' - '+t.artist:t.name));
    it.onclick=()=>spPlayRow(al.uri,t.uri,null);
    L.appendChild(it);
  });
}
async function spTracks(L){
  $('plt').textContent=spPl.name.toUpperCase().slice(0,22);
  L.innerHTML='';L.appendChild(mk('div','empty','LOADING SONGS...'));
  const pl=spPl, r=await api.spItems(pl.id);
  if(!spot||spView!=='tracks'||spPl!==pl)return;
  L.innerHTML='';
  const back=mk('div','item act');back.appendChild(mk('span','n','<'));back.appendChild(mk('span','t','BACK TO PLAYLISTS'));
  back.onclick=()=>{spView='lists';spList()};L.appendChild(back);
  if(!r.ok||!r.data.length){
    $('count').textContent='0 SONGS';
    L.appendChild(mk('div','empty',r.ok?'NO SONGS TO SHOW. SPOTIFY ONLY SHARES THE SONGS OF PLAYLISTS YOU MADE YOURSELF.':r.error));
    return;
  }
  $('count').textContent=r.data.length+' SONGS';
  r.data.forEach((t,i)=>{
    const it=mk('div','item');it.appendChild(mk('span','n',String(i+1).padStart(2,'0')));
    it.appendChild(mk('span','t',t.artist?t.name+' - '+t.artist:t.name));
    it.onclick=async()=>{
      setMarq('*** ASKING SPOTIFY (STARTS IT IF CLOSED)... ***');
      const pr=await api.spPlay(pl.uri,t.uri);
      if(!pr.ok)setMarq('*** '+pr.error+' ***');
    };
    L.appendChild(it);
  });
}

function spPos(){
  if(!(sp&&sp.ok))return 0;
  let p=sp.pos+(sp.playing?(Date.now()-spAt)/1000:0);
  if(sp.dur>0&&p>sp.dur)p=sp.dur;
  return Math.floor(p);
}
function spApply(){
  if(!spot)return;
  if(!(sp&&sp.ok)){
    if(spKey!=='none'){spKey='none';setMarq('*** OPEN THE SPOTIFY APP ***');if(window.PixelArt)PixelArt.setPlaying(false)}
    $('st').textContent='WAIT';$('st').classList.remove('on');$('play').textContent='>';
    $('time').textContent='00:00';$('seekfill').style.width='0%';
    return;
  }
  const name=sp.artist?sp.title+' - '+sp.artist:sp.title;
  if(spKey!==name){
    spKey=name;setMarq('*** '+name+' ***');
    if(window.PixelArt)PixelArt.setSong({title:name,cover:sp.cover||null});
  }
  if(window.PixelArt)PixelArt.setPlaying(sp.playing);
  $('st').textContent=sp.playing?'SPOTIFY':'PAUSE';$('st').classList.toggle('on',sp.playing);
  $('kbps').textContent='LIVE';
  $('play').textContent=sp.playing?'II':'>';
  const p=spPos();
  $('time').textContent=fmt(p);
  $('seekfill').style.width=(sp.dur>0?p/sp.dur*100:0)+'%';
}
if(window.api&&window.api.onSpotify){
  window.api.onSpotify(s=>{sp=s;spAt=Date.now();spApply();pushBuddy(true)});
  setInterval(()=>{if(spot){spApply();pushBuddy()}},250);
}
$('spot').onclick=()=>{
  if(window.PTX)PTX.close();
  if(!(window.api&&window.api.spotifyOn)){setMarq('SPOTIFY LINK NEEDS THE DESKTOP APP');return}
  spot=!spot;$('spot').classList.toggle('on',spot);
  if(spot){
    au.pause();sp=null;spKey='';
    setMarq('*** LOOKING FOR SPOTIFY... ***');
    api.spotifyOn();spView='lists';spList();
  }else{
    api.spotifyOff();sp=null;spKey='';
    $('kbps').textContent='128KBPS';
    $('st').textContent='STOP';$('st').classList.remove('on');$('play').textContent='>';
    $('time').textContent=fmt(au.currentTime);
    setMarq(cur>=0&&songs[cur]?'*** '+songs[cur].name+' ***':'*** WELCOME ***');
    if(window.PixelArt){PixelArt.setPlaying(!au.paused);if(cur>=0&&songs[cur])PixelArt.setSong({title:songs[cur].name,cover:songs[cur].blob})}
    $('plt').textContent='PLAYLIST';render();
    pushBuddy(true);
  }
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();$('play').click()}
  else if(e.code==='ArrowRight'){au.currentTime+=5}
  else if(e.code==='ArrowLeft'){au.currentTime-=5}
  else if(e.code==='ArrowUp'){setVol(au.volume+0.05)}
  else if(e.code==='ArrowDown'){setVol(au.volume-0.05)}
  else if(e.key==='n'){next(false)}
  else if(e.key==='p'){prev()}
});
/* ---------- bridge for extras.js (pet, lyrics, skins, clip, ambient) ---------- */
window.PT={
  state(){
    if(spot){const ok=sp&&sp.ok;return{src:'spotify',title:ok?sp.title:'',artist:ok?(sp.artist||''):'',playing:!!(ok&&sp.playing),pos:spPos(),dur:ok?sp.dur:0,file:null}}
    const s=(cur>=0&&songs[cur])?songs[cur]:null;
    return{src:'mp3',title:s?s.name:'',artist:'',playing:!!s&&!au.paused&&!au.ended,pos:au.currentTime||0,dur:isFinite(au.duration)?au.duration:0,file:s?s.blob:null,name:s?s.name:''};
  },
  bars(n){
    const out=new Array(n).fill(0);
    if(analyser&&!au.paused&&!spot){analyser.getByteFrequencyData(data);for(let i=0;i<n;i++)out[i]=data[Math.min(data.length-1,1+Math.floor(i*(data.length-1)/n))]/255}
    else if(spot&&sp&&sp.ok&&sp.playing){const t=Date.now()/1000;for(let i=0;i<n;i++)out[i]=0.25+0.55*Math.abs(Math.sin(t*3.1+i*0.55)*Math.cos(t*1.7+i*0.31))}
    return out;
  },
  audio(){return ctx?{ctx,au,origGain}:null},
  marq:setMarq,
  rerender(){if(!spot)$('plt').textContent='PLAYLIST';render()},
  isSpotify(){return spot}
};
})();

/* ---------- desktop widget controls (only inside the app) ---------- */
(function(){
  const api=window.api, pl=document.querySelector('.player');
  let compact=false; try{compact=localStorage.compact==='1'}catch(e){}
  function fit(){ if(api) api.fit(Math.ceil(pl.getBoundingClientRect().height)+20) }
  function applyCompact(){ pl.classList.toggle('compact',compact); document.getElementById('wlist').textContent=compact?'FULL':'MINI'; try{localStorage.compact=compact?'1':'0'}catch(e){} setTimeout(fit,30) }
  document.getElementById('wlist').onclick=()=>{compact=!compact;applyCompact()};
  applyCompact();
  if(!api){ ['wpin','wmin','wx'].forEach(i=>document.getElementById(i).style.display='none'); return }
  document.getElementById('wx').onclick=()=>api.close();
  document.getElementById('wmin').onclick=()=>api.min();
  const pin=document.getElementById('wpin');
  api.getPin().then(v=>pin.classList.toggle('on',v));
  pin.onclick=()=>api.pin().then(v=>pin.classList.toggle('on',v));
})();
